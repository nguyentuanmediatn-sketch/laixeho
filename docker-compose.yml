version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: laixeho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laixeho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laixeho_secret}
      POSTGRES_DB: ${POSTGRES_DB:-laixeho_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: laixeho-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
